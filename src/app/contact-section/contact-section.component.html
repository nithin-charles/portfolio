<div class="contact-container">
  <div class="section-header-row">
    <div class="section-tag">
      <span class="section-number">04</span>
      <span class="slash">//</span>
      <span class="section-name">GET IN TOUCH</span>
    </div>
    <div class="contact-subtitle">
      Open to engineering opportunities, technical collaborations, and discussions.
    </div>
  </div>

  <div class="contact-main-wrapper">
    <div class="identity-card">
      <div class="name-block">
        <h2 class="first-name">Nithin</h2>
        <div class="role-row">
          <div class="role-pill">Software Development Engineer II</div>
        </div>
        <h2 class="last-name">Charles<span class="dot">.</span></h2>
      </div>

      <div class="quick-copy-actions">
        <button
          class="copy-chip"
          (click)="copyEmail()"
          [class.copied]="copiedEmail"
          [title]="copiedEmail ? 'Email copied!' : 'Click to copy email address'"
        >
          <span class="chip-icon">{{ copiedEmail ? '✓' : '✉' }}</span>
          <span class="chip-label">{{ copiedEmail ? 'Email Copied!' : 's.nithincharles@gmail.com' }}</span>
        </button>

        <button
          class="copy-chip"
          (click)="copyPhone()"
          [class.copied]="copiedPhone"
          [title]="copiedPhone ? 'Phone copied!' : 'Click to copy phone number'"
        >
          <span class="chip-icon">{{ copiedPhone ? '✓' : '✆' }}</span>
          <span class="chip-label">{{ copiedPhone ? 'Phone Copied!' : '+91 8838758014' }}</span>
        </button>
      </div>
    </div>

    <div class="navigation-card">
      <div class="card-inner">
        <div class="nav-title">Quick Navigation</div>
        <div class="nav-pills">
          <button class="nav-chip" (click)="scrollToSection($event, 'home')">Home</button>
          <button class="nav-chip" (click)="scrollToSection($event, 'about')">About</button>
          <button class="nav-chip" (click)="scrollToSection($event, 'work')">Experience</button>
          <button class="nav-chip" (click)="scrollToSection($event, 'projects')">Projects</button>
        </div>

        <div class="site-credit">
          <div class="credit-dot"></div>
          <div class="credit-text">
            <span>Handcrafted by Nithin Charles</span>
            <span class="credit-sub">Built with Angular 18 & SCSS · Deployed on Vercel</span>
          </div>
        </div>
      </div>
    </div>
  </div>
